<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MealPrep v3</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#20241f;--muted:#6d746d;--line:#dfe4dd;--accent:#4f7b57;--accent2:#eaf2eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#26352a;color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:21px}nav button{border:0;background:transparent;color:#dce7de;padding:8px 10px;border-radius:9px;cursor:pointer}nav button.active,nav button:hover{background:#3a4c3d;color:#fff}
main{max-width:1180px;margin:16px auto;padding:0 12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.span4{grid-column:span 4}.span8{grid-column:span 8}.span12{grid-column:span 12}
h2,h3{margin-top:0}.muted{color:var(--muted)}label{display:block;margin:11px 0 5px;font-weight:650}input,select{width:100%;padding:9px 10px;border:1px solid #ccd4cb;border-radius:9px;background:#fff}button{font:inherit}.btn{border:1px solid #cbd4cc;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{padding:6px 9px;font-size:13px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:#fff}.chip.on{background:var(--accent2);border-color:#a9c2ad;color:#315238}
.sliderRow{margin:12px 0}.sliderHead{display:flex;justify-content:space-between}.sliderRow input{padding:0;border:0}
.days{overflow-x:auto}.matrix{min-width:820px;border-collapse:separate;border-spacing:0;width:100%}.matrix th,.matrix td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;vertical-align:top;background:#fff}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#f8faf7;z-index:2}.matrix th{font-size:13px;color:var(--muted)}.mealbox{min-width:125px}.daytotal{min-width:118px;font-size:12px;white-space:nowrap}.iconbtn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.iconbtn:hover{background:#f1f5f0}.fav{color:#778078}.fav.on{color:#4f7b57}.mealname{font-weight:700;margin-bottom:6px}.meal-actions{display:flex;gap:6px}.recipe-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px;background:#edf1ec}.placeholder{display:flex;align-items:center;justify-content:center;color:#8a938a}.recipe-card{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff}.category{cursor:pointer}.category:hover{border-color:#a9c2ad}.notice{background:#f1f6f1;border:1px solid #cfe0d0;padding:10px;border-radius:10px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:18px}.alt-list{max-height:360px;overflow-y:auto}.alt{padding:11px;border-bottom:1px solid var(--line);cursor:pointer}.alt:hover{background:#f4f7f3}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f5f7f4;border-radius:11px;padding:10px 13px;min-width:130px}.stat b{display:block;font-size:19px}.empty{text-align:center;padding:28px;color:var(--muted)}
@media(max-width:760px){.span4,.span8{grid-column:span 12}.matrix{min-width:760px}header{align-items:flex-start;gap:10px;flex-direction:column}}
</style>

<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1f2721;--muted:#727b74;--line:#e3e8e2;--accent:#477653;--accent2:#edf5ee;--shadow:0 8px 24px rgba(30,45,34,.06)}
body{background:linear-gradient(180deg,#f7f9f6 0,#f1f4f0 100%);color:var(--ink)}
header{background:rgba(31,43,34,.96);backdrop-filter:blur(10px);padding:14px 18px;box-shadow:0 2px 16px rgba(0,0,0,.08)}
header h1{font-size:19px;letter-spacing:-.02em}
nav button{font-size:13px;padding:7px 10px}
main{max-width:1160px;margin:14px auto;padding:0 12px}
.card{border:1px solid rgba(220,227,219,.9);border-radius:16px;padding:13px;box-shadow:var(--shadow)}
h2{font-size:20px;letter-spacing:-.02em;margin-bottom:5px}h3{font-size:15px}
.btn{border-radius:9px}.btn.primary{box-shadow:0 4px 10px rgba(71,118,83,.16)}
.chip{padding:6px 9px;font-size:13px}
.matrix{border-spacing:6px;min-width:0}.matrix th,.matrix td{border:0;border-radius:12px;padding:9px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.matrix th:first-child,.matrix td:first-child{position:static;background:transparent;box-shadow:none;font-weight:700}
.matrix th{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.mealbox{min-width:112px}.mealname{font-size:12px;line-height:1.25;margin-bottom:6px}
.iconbtn{width:27px;height:27px;border-radius:8px;font-size:13px}
.daytotal{min-width:92px;font-size:11px;line-height:1.45}
.total-kcal{font-weight:750;font-size:13px}
.kcal-good{color:#3d7a4b}.kcal-warn{color:#a77818}.kcal-bad{color:#b34d4d}
.recipe-card{border:1px solid var(--line);border-radius:13px;padding:10px}
.modalbox{box-shadow:0 20px 60px rgba(0,0,0,.18)}
@media(max-width:760px){
 header{position:sticky;top:0}.grid{gap:9px}.card{padding:12px}
 .matrix{min-width:0;border-spacing:4px}.matrix th,.matrix td{padding:7px 5px}
 .matrix th:first-child,.matrix td:first-child{display:table-cell;width:44px}
 .matrix th:not(:first-child){font-size:9px}
 .mealbox{min-width:0}.mealname{font-size:11px}
 .daytotal{min-width:70px;font-size:10px}.daytotal .macroline{display:none}
 .matrix .meal-actions{gap:4px}
 .iconbtn{width:25px;height:25px}
}
@media(max-width:560px){
 nav{width:100%;display:flex;overflow:auto;gap:2px}nav button{white-space:nowrap}
 .matrix{font-size:11px}.matrix th,.matrix td{padding:6px 3px}
 .mealname{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .daytotal{min-width:58px}.total-kcal{font-size:11px}
}
</style>
</head>
<body>
<header><h1>🥗 MealPrep</h1><nav id="nav"></nav></header>
<main id="content"></main>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox" id="modalbox"></div></div>
<script>
const defaultRecipes=[
{id:1,name:"Kycklingpasta",cat:"Lunch",kcal:620,p:48,c:65,f:18,img:""},
{id:2,name:"Lax & potatis",cat:"Lunch",kcal:610,p:42,c:52,f:24,img:""},
{id:3,name:"Tacos",cat:"Middag",kcal:680,p:44,c:58,f:26,img:""},
{id:4,name:"Kycklingcurry",cat:"Middag",kcal:590,p:46,c:50,f:21,img:""},
{id:5,name:"Havregröt",cat:"Frukost",kcal:390,p:25,c:53,f:9,img:""},
{id:6,name:"Äggmacka",cat:"Frukost",kcal:410,p:28,c:38,f:17,img:""},
{id:7,name:"Proteinyoghurt",cat:"Snack",kcal:220,p:24,c:18,f:5,img:""},
{id:8,name:"Proteinmuffins",cat:"Snack",kcal:180,p:18,c:16,f:6,img:""}
];
function read(k,f){try{let x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
let recipes=read("mp_recipes_v3",defaultRecipes).map(r=>({...r,favorite:!!r.favorite,ingredients:r.ingredients||[],instructions:r.instructions||""}));
let goals=read("mp_goals_v3",{kcal:1700,protein:35,carbs:35,fat:30,meals:["Frukost","Lunch","Middag","Snack"],planDays:["Mån","Tis","Ons","Tor","Fre"],mealprepDays:["Sön","Ons"],weekStart:"Sön"}); goals.weekStart=goals.weekStart||"Sön"; goals.planDays=goals.planDays||goals.cookDays||["Mån","Tis","Ons","Tor","Fre"]; 
let plan=read("mp_plan_v3",null), page="home", activeCat=null;
const cats=["Frukost","Lunch","Middag","Snack"],days=["Mån","Tis","Ons","Tor","Fre","Lör","Sön"]; const dayOrder=()=>{let i=days.indexOf(goals.weekStart||"Sön");return [...days.slice(i),...days.slice(0,i)]};
function save(){localStorage.setItem("mp_recipes_v3",JSON.stringify(recipes));localStorage.setItem("mp_goals_v3",JSON.stringify(goals));localStorage.setItem("mp_plan_v3",JSON.stringify(plan))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nav(){document.getElementById("nav").innerHTML=[["home","Översikt"],["recipes","Mina recept"],["plan","Denna vecka"],["shop","Inköpslista"]].map(([p,n])=>`<button class="${page===p?'active':''}" onclick="show('${p}')">${n}</button>`).join("")}
function show(p){page=p;nav();if(p==="home")homePage();if(p==="recipes")recipesPage();if(p==="plan")planPage();if(p==="shop")shopPage()}
function homePage(){document.getElementById("content").innerHTML=`<div class="grid"><div class="card span12"><h2>Din MealPrep</h2><p class="muted">Bygg en veckomeny från recepten du själv sparar.</p><div class="stats"><div class="stat">Kcal<b>${goals.kcal}</b><span class="muted">per dag</span></div><div class="stat">Macros<b>${goals.protein}/${goals.carbs}/${goals.fat}</b><span class="muted">P / K / F %</span></div><div class="stat">Måltider<b>${goals.meals.length}</b><span class="muted">per dag</span></div></div></div></div>`}
function recipesPage(){
 if(activeCat){
  let list=recipes.filter(r=>r.cat===activeCat);
  document.getElementById("content").innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn" onclick="activeCat=null;recipesPage()">← Mina recept</button><h2 style="margin:0">${activeCat}</h2></div><div class="card"><div class="row" style="justify-content:space-between"><h3>${list.length} recept</h3><button class="btn primary" onclick="addRecipe('${activeCat}')">＋ Lägg till recept</button></div>${list.length?list.map(recipeCard).join(""):"<div class='empty'>Inga recept ännu.</div>"}</div>`;
  return;
 }
 document.getElementById("content").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Mina recept</h2><div class="muted">Välj en måltidstyp för att se recepten.</div></div><button class="btn primary" onclick="addRecipe('Lunch')">＋ Lägg till recept</button></div><div class="grid" style="margin-top:14px">${cats.map(c=>`<div class="card category span4" onclick="activeCat='${c}';recipesPage()"><h3>${c}</h3><div class="muted">${recipes.filter(r=>r.cat===c).length} recept</div></div>`).join("")}</div></div>`;
}
function recipeCard(r){return `<div class="recipe-card"><div>${r.img?`<img class="recipe-img" src="${r.img}">`:`<div class="recipe-img placeholder">📷</div>`}</div><div><h3>${esc(r.name)}</h3><div class="muted">${r.kcal} kcal · ${r.p} g P · ${r.c} g K · ${r.f} g F per portion</div><div class="row" style="margin-top:8px"><button class="btn small" onclick="editRecipe(${r.id})">Redigera</button><button class="btn small" onclick="deleteRecipe(${r.id})">Ta bort</button><button class="iconbtn fav ${r.favorite?'on':''}" title="Favorit i veckomenyn" aria-label="Favorit" onclick="toggleFavorite(${r.id})">${r.favorite?'★':'☆'}</button></div></div></div>`}
function addRecipe(cat){editRecipe(null,cat)}
function editRecipe(id,catOverride){
 let r=id?recipes.find(x=>x.id===id):{name:"",cat:catOverride||"Lunch",kcal:500,p:30,c:40,f:15,img:""};
 document.getElementById("modalbox").innerHTML=`<h2>${id?"Redigera":"Nytt recept"}</h2>
 <label>Namn</label><input id="rn" value="${esc(r.name)}">
 <label>Måltidstyp</label><select id="rc">${cats.map(c=>`<option ${r.cat===c?"selected":""}>${c}</option>`).join("")}</select>
 <label>Foto</label><input id="ri" type="file" accept="image/*" onchange="previewImage(this)"><div id="preview" style="margin-top:7px">${r.img?`<img class="recipe-img" src="${r.img}">`:""}</div>
 <label>Ingredienser</label><div id="ingredients">${(r.ingredients||[]).map((x,i)=>ingredientRow(x,i)).join("")}</div><button class="btn small" type="button" onclick="addIngredientRow()">＋ Ingrediens</button>
 <label>Tillagning</label><textarea id="instructions" rows="5" style="width:100%;padding:9px;border:1px solid #ccd4cb;border-radius:9px">${esc(r.instructions||"")}</textarea>
 <div class="notice" style="margin-top:10px"><b>✨ Importera recept med AI</b><br>
<span class="muted">Ladda upp en skärmdump från Instagram/hemsida eller ett foto från en bok. AI försöker fylla i receptet — du granskar alltid innan du sparar.</span>
<div class="row" style="margin-top:8px"><input id="aii" type="file" accept="image/*" onchange="aiImportPreview(this)"><button class="btn primary" type="button" onclick="runAIImport()">Analysera bild</button><button class="btn small" type="button" onclick="setAIKey()">API-nyckel</button></div>
<div id="aipreview" style="margin-top:7px"></div></div>
 <label>Kcal per portion</label><input id="rk" type="number" value="${r.kcal}">
 <label>Protein, g per portion</label><input id="rp" type="number" value="${r.p}">
 <label>Kolhydrater, g per portion</label><input id="rcc" type="number" value="${r.c}">
 <label>Fett, g per portion</label><input id="rf" type="number" value="${r.f}">
 <div class="row" style="margin-top:15px"><button class="btn primary" onclick="saveRecipe(${id||0})">Spara</button><button class="btn" onclick="closeModal()">Avbryt</button></div>`;
 window.pendingImage=r.img||"";openModal();
}
function previewImage(inp){let f=inp.files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{window.pendingImage=e.target.result;document.getElementById("preview").innerHTML=`<img class="recipe-img" src="${e.target.result}">`};rd.readAsDataURL(f)}

function ingredientRow(x={},i){let units=["st","g","kg","ml","cl","dl","l","tsk","msk","krm","burk","förpackning","påse","flaska","paket","ask","knippe","skiva","klyfta","portion","annan"];return `<div class="row ing" style="margin:6px 0"><input class="iname" placeholder="Ingrediens" value="${esc(x.name||"")}"><input class="iqty" type="number" step="any" placeholder="Mängd" value="${x.qty??""}" style="max-width:100px"><select class="iunit" style="max-width:150px">${units.map(u=>`<option ${x.unit===u?"selected":""}>${u}</option>`).join("")}</select><button class="iconbtn" type="button" title="Ta bort" onclick="this.parentElement.remove()">×</button></div>`}
function addIngredientRow(){document.getElementById("ingredients").insertAdjacentHTML("beforeend",ingredientRow({},document.querySelectorAll(".ing").length))}

function getAIKey(){return localStorage.getItem("mealprep_openai_key")||""}
function setAIKey(){let k=prompt("Klistra in din OpenAI API-nyckel. Den sparas endast lokalt i denna webbläsare. För personlig testning.",getAIKey());if(k!==null){localStorage.setItem("mealprep_openai_key",k.trim());alert("API-nyckeln är sparad lokalt.")}}
async function runAIImport(){
  const inp=document.getElementById("aii"), f=inp?.files?.[0];
  if(!f){alert("Välj en bild först.");return}
  let key=getAIKey(); if(!key){setAIKey(); key=getAIKey(); if(!key)return}
  const status=document.getElementById("aipreview"); status.textContent="Analyserar receptet…";
  const dataUrl=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  const prompt=`Läs receptet i bilden och returnera ENDAST JSON med exakt dessa fält:
{"name":"","cat":"","kcal":0,"p":0,"c":0,"f":0,"ingredients":[{"name":"","qty":0,"unit":""}],"instructions":""}
cat måste vara en av: Frukost, Lunch, Middag, Snack.
kcal, p, c, f ska vara per portion om informationen finns. Om ett värde saknas, använd 0 och gissa inte.
För ingredienser: använd svenska vanliga enheter när möjligt: st,g,kg,ml,cl,dl,l,tsk,msk,krm,burk,förpackning,påse,flaska,paket,ask,knippe,skiva,klyfta,portion.
Läs text även om den ligger på en bokssida, skärmdump eller foto.`;
  try{
    const resp=await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model:"gpt-4.1-mini",input:[{role:"user",content:[{type:"input_text",text:prompt},{type:"input_image",image_url:dataUrl}]}],temperature:0})});
    if(!resp.ok) throw new Error("API-fel "+resp.status);
    const j=await resp.json();
    let text=j.output?.map(x=>x.content||[]).flat().map(x=>x.text||"").join("")||"";
    text=text.replace(/```json|```/g,"").trim();
    const obj=JSON.parse(text);
    fillAIRecipe(obj);
    status.textContent="Klart — kontrollera uppgifterna och spara receptet.";
  }catch(e){console.error(e);status.textContent="Kunde inte läsa receptet: "+e.message+". Kontrollera API-nyckeln och försök igen."}
}
function fillAIRecipe(o){
  const set=(id,v)=>{let el=document.getElementById(id);if(el&&v!==undefined)el.value=v};
  set("rn",o.name||""); set("rc",o.cat||"Lunch"); set("rk",o.kcal||0); set("rp",o.p||0); set("rcc",o.c||0); set("rf",o.f||0);
  let box=document.getElementById("ingredients"); if(box){box.innerHTML="";(o.ingredients||[]).forEach(x=>box.insertAdjacentHTML("beforeend",ingredientRow(x,0)))}
  set("instructions",o.instructions||"");
}
function aiImportPreview(inp){let f=inp.files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{window.aiImage=e.target.result;document.getElementById("aipreview").innerHTML=`<div class="muted" style="margin-top:6px">Bild vald. I denna kostnadsfria prototyp fylls inget automatiskt utan din bekräftelse.</div>`};rd.readAsDataURL(f)}
function saveRecipe(id){let ingredients=[...document.querySelectorAll("#ingredients .ing")].map(row=>({name:row.querySelector(".iname").value.trim(),qty:parseFloat(row.querySelector(".iqty").value)||0,unit:row.querySelector(".iunit").value})).filter(x=>x.name);
let obj={id:id||Date.now(),name:rn.value.trim()||"Nytt recept",cat:rc.value,kcal:+rk.value||0,p:+rp.value||0,c:+rcc.value||0,f:+rf.value||0,img:window.pendingImage||"",ingredients,instructions:document.getElementById("instructions")?.value||"",favorite:id?(recipes.find(x=>x.id===id)?.favorite||false):false};if(id)recipes=recipes.map(r=>r.id===id?obj:r);else recipes.push(obj);save();closeModal();activeCat=obj.cat;recipesPage()}
function toggleFavorite(id){let r=recipes.find(x=>x.id===id);if(r){r.favorite=!r.favorite;save();recipesPage()}}
function deleteRecipe(id){if(confirm("Ta bort receptet?")){recipes=recipes.filter(r=>r.id!==id);save();recipesPage()}}
function planPage(){
 const sum=+goals.protein + +goals.carbs + +goals.fat;
 const grams={p:Math.round(goals.kcal*goals.protein/100/4),c:Math.round(goals.kcal*goals.carbs/100/4),f:Math.round(goals.kcal*goals.fat/100/9)};
 document.getElementById("content").innerHTML=`<div class="grid"><div class="card span4"><h2>Veckans mål</h2>
 <label>Kcal per dag</label><input id="gk" type="number" value="${goals.kcal}" oninput="goalPreview()">
 ${slider("protein","Protein",goals.protein,grams.p)}${slider("carbs","Kolhydrater",goals.carbs,grams.c)}${slider("fat","Fett",goals.fat,grams.f)}
 <div id="sum" class="notice" style="margin-top:8px">Totalt: <b>${sum}%</b> ${sum===100?"✓":"⚠️"}</div>
 <label>Veckan börjar</label><select id="weekStart" onchange="setWeekStart(this.value)">${dayOrder().map(d=>`<option ${goals.weekStart===d?"selected":""}>${d}</option>`).join("")}</select>
 <label>Måltider per dag</label><div class="chips">${cats.map(c=>`<button class="chip ${goals.meals.includes(c)?"on":""}" onclick="toggleMeal('${c}',this)">${c}</button>`).join("")}</div>
 <label>Dagar menyn ska planeras för</label><div class="chips">${days.map(d=>`<button class="chip ${goals.planDays.includes(d)?"on":""}" onclick="togglePlanDay('${d}',this)">${d}</button>`).join("")}</div>
 <div class="notice">Mealprep utgår nu från veckans start. Du väljer vilka dagar menyn ska planeras för, och appen fördelar batcher framåt från veckans början.</div>
 <div class="row" style="margin-top:14px"><button class="btn primary" onclick="createWeek()">✨ Skapa veckomeny</button><button class="btn" onclick="createWeek(true)">🔄 Gör om veckomeny</button></div></div>
 <div class="card span8"><h2>Veckomeny</h2>${plan?renderMatrix():"<div class='empty'>Skapa en veckomeny för att se den här.</div>"}</div></div>`;
}
function slider(k,label,val,g){return `<div class="sliderRow"><div class="sliderHead"><span>${label}</span><b><span id="${k}v">${val}</span>% · <span id="${k}g">${g}</span> g</b></div><input id="${k}" type="range" min="0" max="100" value="${val}" oninput="goalPreview()"></div>`}
function goalPreview(){let k=+gk.value||1700,p=+protein.value,c=+carbs.value,f=+fat.value;proteinv.textContent=p;carbsv.textContent=c;fatv.textContent=f;proteing.textContent=Math.round(k*p/100/4);carbsg.textContent=Math.round(k*c/100/4);fatg.textContent=Math.round(k*f/100/9);sum.innerHTML=`Totalt: <b>${p+c+f}%</b> ${p+c+f===100?"✓":"⚠️"}`}
function toggleMeal(c,b){goals.meals=goals.meals.includes(c)?goals.meals.filter(x=>x!==c):[...goals.meals,c];b.classList.toggle("on");save()}
function setWeekStart(d){goals.weekStart=d;save();planPage()}
function kcalClass(k){let target=+goals.kcal||1700, pct=Math.abs(k-target)/target;return pct<=.05?"kcal-good":pct<=.10?"kcal-warn":"kcal-bad"}
function togglePlanDay(d,b){goals.planDays=goals.planDays.includes(d)?goals.planDays.filter(x=>x!==d):[...goals.planDays,d];b.classList.toggle("on");save()}

function createWeek(){let p=+protein.value,c=+carbs.value,f=+fat.value,k=+gk.value||1700;if(p+c+f!==100){alert("Protein + kolhydrater + fett måste bli 100 %.");return}if(!goals.meals.length||!goals.planDays.length){alert("Välj minst en dag och minst en måltid.");return}goals={...goals,kcal:k,protein:p,carbs:c,fat:f};save();
let orderedPlanDays=dayOrder().filter(d=>goals.planDays.includes(d));
let out=[]; 
// Mealprep is treated as a batch: one portion is eaten on the prep day,
// and the remaining portions are placed on the next planned days.
let batches={}; // meal category -> {recipe, remaining}
let dayIndex={}; orderedPlanDays.forEach((d,i)=>dayIndex[d]=i);

for(let di=0;di<orderedPlanDays.length;di++){
  const d=orderedPlanDays[di];
  let usedToday=[];
  let items=[];

  for(const m of goals.meals){
    // First consume an existing batch for this meal/category.
    let batch=batches[m];
    let r=batch?.remaining>0 ? batch.recipe : null;

    // On a mealprep day, start a new batch if there isn't one available.
    if(!r && d===orderedPlanDays[0]){
      let pool=recipes.filter(x=>x.cat===m && !usedToday.includes(x.id));
      if(!pool.length) pool=recipes.filter(x=>x.cat===m);
      let fav=pool.filter(x=>x.favorite);
      r=fav.length ? fav[Math.floor(Math.random()*fav.length)] : pool[Math.floor(Math.random()*pool.length)];
      // Default batch size: enough for today plus the next 2 planned days.
      // This is a planning quantity; later versions can expose batch size.
      if(r) batches[m]={recipe:r,remaining:Math.min(2, Math.max(0, orderedPlanDays.length-di-1))};
    }

    // If no batch is available, select a fresh recipe for this day.
    if(!r){
      let pool=recipes.filter(x=>x.cat===m && !usedToday.includes(x.id));
      if(!pool.length) pool=recipes.filter(x=>x.cat===m);
      let fav=pool.filter(x=>x.favorite);
      r=fav.length ? fav[Math.floor(Math.random()*fav.length)] : pool[Math.floor(Math.random()*pool.length)];
    }

    // Never use the same recipe twice on the same day.
    if(r && usedToday.includes(r.id)){
      let alt=recipes.find(x=>x.cat===m && !usedToday.includes(x.id));
      if(alt) r=alt;
    }
    if(r) usedToday.push(r.id);

    // A batch supplies today's portion; then decrement the future portions.
    if(batches[m]?.recipe?.id===r?.id && batches[m].remaining>0) batches[m].remaining--;

    items.push({meal:m,r:r||null});
  }

  let kcal=items.reduce((s,x)=>s+(x.r?.kcal||0),0);
  out.push({
    day:d,
    items,
    kcal,
    p:items.reduce((s,x)=>s+(x.r?.p||0),0)
  });
}
plan=out;save();planPage()}
function renderMatrix(){let meals=goals.meals;return `<div class="days"><table class="matrix"><thead><tr><th>Dag</th>${meals.map(m=>`<th>${m}</th>`).join("")}<th>Totalt</th></tr></thead><tbody>${plan.map(d=>`<tr><th>${d.day}</th>${meals.map(m=>{let x=d.items.find(i=>i.meal===m);return `<td>${x&&x.r?`<div class="mealbox"><div class="mealname">${esc(x.r.name)}</div><div class="meal-actions"><button class="iconbtn" title="Byt recept" aria-label="Byt recept" onclick="alternatives('${d.day}','${m}',${x.r.id})">↻</button><button class="iconbtn" title="Visa macros" aria-label="Visa macros" onclick="macros(${x.r.id})">▥</button></div></div>`:"—"}</td>`}).join("")}<td><div class="daytotal ${kcalClass(d.kcal)}"><div class="total-kcal">${d.kcal} kcal</div><div class="macroline">P ${Math.round(d.items.reduce((s,i)=>s+(i.r?.p||0),0))} · K ${Math.round(d.items.reduce((s,i)=>s+(i.r?.c||0),0))} · F ${Math.round(d.items.reduce((s,i)=>s+(i.r?.f||0),0))} g</div></div></td></tr>`).join("")}</tbody></table></div>`}
function alternatives(day,meal,current){let pool=recipes.filter(r=>r.cat===meal&&r.id!==current);document.getElementById("modalbox").innerHTML=`<h2>Byt ${meal.toLowerCase()}</h2><div class="muted" style="margin-bottom:8px">Välj ett annat recept i samma kategori.</div><div class="alt-list">${pool.length?pool.map(r=>`<div class="alt" onclick="chooseAlt('${day}','${meal}',${r.id})"><b>${esc(r.name)}</b><br><span class="muted">${r.kcal} kcal · ${r.p} g P · ${r.c} g K · ${r.f} g F</span></div>`).join(""):"<div class='empty'>Inga andra recept i denna kategori.</div>"}</div><button class="btn" style="margin-top:10px" onclick="closeModal()">Stäng</button>`;openModal()}
function chooseAlt(day,meal,id){let d=plan.find(x=>x.day===day),x=d.items.find(i=>i.meal===meal);x.r=recipes.find(r=>r.id===id);d.kcal=d.items.reduce((s,i)=>s+(i.r?.kcal||0),0);d.p=d.items.reduce((s,i)=>s+(i.r?.p||0),0);save();closeModal();planPage()}
function macros(id){let r=recipes.find(x=>x.id===id);document.getElementById("modalbox").innerHTML=`<h2>${esc(r.name)}</h2><div class="stats"><div class="stat">Kcal<b>${r.kcal}</b><span class="muted">per portion</span></div><div class="stat">Protein<b>${r.p} g</b></div><div class="stat">Kolhydrater<b>${r.c} g</b></div><div class="stat">Fett<b>${r.f} g</b></div></div><button class="btn" style="margin-top:14px" onclick="closeModal()">Stäng</button>`;openModal()}
function shopPage(){let counts={};(plan||[]).forEach(d=>d.items.forEach(x=>{if(x.r)(x.r.ingredients||[]).forEach(i=>{let key=i.name+"|"+i.unit;counts[key]=(counts[key]||0)+i.qty})}));document.getElementById("content").innerHTML=`<div class="card"><h2>Inköpslista</h2><ul>${Object.entries(counts).map(([k,q])=>{let [n,u]=k.split("|");return `<li>${esc(n)} — ${q} ${esc(u)}</li>`}).join("")||"<li>Skapa en veckomeny först.</li>"}</ul></div>`}
function openModal(){modal.classList.add("show")}function closeModal(){modal.classList.remove("show")}
show("home");
</script>
</body></html>
